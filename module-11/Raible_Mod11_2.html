<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Assignment 11.2 - JavaScript To-Do List">
    <meta name="keywords" content="HTML, CSS, JavaScript, To-Do List">
    <meta name="author" content="Lisa Raible">

    <title>
        CSD 340 Web Development with HTML and CSS
    </title>

    <link rel="stylesheet" href="Raible_Mod11_2.css">
</head>

<body>
    <div id="container">

        <h1>
            Assignment 11.2: JavaScript - Part 3
        </h1>

        <h2>
            My To-Do List
        </h2>

        <p>
            Enter a task in the text box and click Add to save it. Click Sort to arrange your tasks alphabetically. Click Delete Last Entry to remove the final task from the list.
        </p>

        <div class="todo-card">

            <label for="taskInput">
                Enter a Task
            </label>

            <input type="text" id="taskInput" placeholder="Enter a task">

            <div class="buttons">

                <button type="button" onclick="addTask()">
                    Add
                </button>

                <button type="button" onclick="deleteLastEntry()">
                    Delete Last Entry
                </button>

                <button type="button" onclick="sortTasks()">
                    Sort
                </button>

            </div>

            <h3>
                Things To Do
            </h3>

            <ol id="taskList"></ol>

            <p id="emptyMessage">
                No tasks added yet.
            </p>

        </div>

        <p class="back-link">
            <a href="../index.html">
                Back to Landing Page
            </a>
        </p>

    </div>

    <script>

        let tasks = [];

        function addTask() {
            let input = document.getElementById("taskInput");
            let task = input.value.trim();

            if (task === "") {
                alert("Please enter a task.");
                return;
            }

            tasks.push(task);

            alert("Task added: " + task);

            input.value = "";

            displayTasks();
        }

        function deleteLastEntry() {

            if (tasks.length === 0) {
                alert("There are no tasks to delete.");
                return;
            }

            let removedTask = tasks.pop();

            alert("Task deleted: " + removedTask);

            displayTasks();
        }

        function sortTasks() {

            tasks.sort((a, b) => a.localeCompare(b));

            alert("Your to-do list has been sorted.");

            displayTasks();
        }

        function displayTasks() {

            let taskList = document.getElementById("taskList");
            let emptyMessage = document.getElementById("emptyMessage");

            taskList.innerHTML = "";

            if (tasks.length === 0) {
                emptyMessage.style.display = "block";
            } else {
                emptyMessage.style.display = "none";
            }

            for (let i = 0; i < tasks.length; i++) {
                let listItem = document.createElement("li");

                listItem.textContent = tasks[i];

                taskList.appendChild(listItem);
            }
        }
    </script>
    
</body>
</html>
